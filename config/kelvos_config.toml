# kelvos traffic monitor configuration
# 
[traffic_monitor]
# Enable or disable the traffic monitor
enabled = true

# Ethernet interface name to attach XDP program to
ethernet_interface = "wlp1s0"

# Path to the log file where JSON events will be appended
traffic_log_file = "/var/log/kelvos_traffic_monitor.jsonl"

[protocols]
# IPv4/IPv6 protocol numbers (IANA assigned)
tcp         = 6    # Transmission Control
udp         = 17   # User Datagram
icmp        = 1    # Internet Control Message Protocol
icmpv6      = 58   # ICMP for IPv6

# PORT DEFINITIONS

[[ports]]
service     = "http"
numbers     = [80]
protocols   = ["tcp"]
description = "Hypertext Transfer Protocol"

[[ports]]
service     = "https"
numbers     = [443]
protocols   = ["tcp"]
description = "HTTP over TLS"

# RULES DEFINITIONS

[firewall]
default_ingress = "allow"
default_egress = "allow"

[[rules]]
id = 100
action = "allow"
direction = "ingress"
protocols = ["tcp"]
destination_ports = [22, 2222]
state = ["established", "related"]

[[rules]]
id = 200
action = "allow"
direction = "egress"
protocols = ["tcp", "udp"]
destination_ports = [53]

[[rules]]
id = 300
action = "allow"
direction = "ingress"
protocols = ["tcp"]
destination_ports = [23]

[[rules]]
id = 500
action = "rate_limit"
direction = "ingress"
protocol = "tcp"
flags = ["syn"]
rate = "100/s"
burst = 200

[[rules]]
id = 501
action = "rate_limit"
direction = "ingress"
protocol = "udp"
rate = "500/s"
burst = 1000

[[rules]]
id = 502
action = "rate_limit"
direction = "ingress"
protocol = "icmp"
rate = "50/s"
burst = 100

[[rules]]
id = 503
action = "rate_limit"
direction = "ingress"
protocol = "icmpv6"
rate = "50/s"
burst = 100